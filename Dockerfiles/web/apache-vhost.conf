<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex index.php

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Never serve application code even if someone points the docroot one level too high
    <DirectoryMatch "/var/www/html/app">
        Require all denied
    </DirectoryMatch>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
